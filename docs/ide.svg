<circle cx="22" cy="20" r="6" fill="#e06c5d"/><circle cx="42" cy="20" r="6" fill="#e6b450"/><circle cx="62" cy="20" r="6" fill="#62b26b"/>
<rect x="20" y="54" width="120" height="28" rx="6" fill="#2e7d32"/><text x="80" y="73" text-anchor="middle" font-size="15" fill="#fff">▶</text>
<rect x="20" y="92" width="860" height="290" rx="6" fill="#fbfaf7" stroke="#bbb"/>
<text x="868" y="118" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">#ضمن &lt;stdio.h&gt;</text>
<text x="868" y="139" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* رەتلەنگەن تىزمىدا ئىككىلىك ئىزدەش */</text>
<text x="868" y="160" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">صحيح ئىككىلىك_ئىزدەش(صحيح قىممەتلەر[], صحيح سانى, صحيح ئاچقۇچ) {</text>
<text x="868" y="181" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  صحيح تۆۋەن = 0, يۇقىرى = سانى - 1;</text>
<text x="868" y="202" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  طالما (تۆۋەن &lt;= يۇقىرى) {</text>
<text x="868" y="223" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    صحيح ئوتتۇرا = تۆۋەن + (يۇقىرى - تۆۋەن) / 2;</text>
<text x="868" y="244" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    إذا (قىممەتلەر[ئوتتۇرا] == ئاچقۇچ) أرجع ئوتتۇرا;</text>
<text x="868" y="265" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    إذا (قىممەتلەر[ئوتتۇرا] &lt; ئاچقۇچ) تۆۋەن = ئوتتۇرا + 1; وإلا يۇقىرى = ئوتتۇرا - 1;</text>
<text x="868" y="286" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="868" y="307" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  أرجع -1;</text>
<text x="868" y="328" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="868" y="349" text-anchor="end" direction="rtl" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">صحيح ئاساسىي(فراغ) {</text>
</svg>